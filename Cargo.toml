[package]
name = "linuxautoswitch"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Automatic EN/RU keyboard layout correction for Hyprland/Omarchy"
repository = "https://github.com/mitialab/linuxautoswitch"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
evdev = "0.13.2"
fst = "0.4.7"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking", "async-io", "blocking-api"] }

[build-dependencies]
fst = "0.4.7"

# build.rs compiles ~1.9M dictionary words into fst sets on every rebuild;
# an unoptimized build script makes that step several times slower.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
