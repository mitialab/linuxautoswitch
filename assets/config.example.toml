# linuxautoswitch config
# Copy to $XDG_CONFIG_HOME/linuxautoswitch/config.toml (usually
# ~/.config/linuxautoswitch/config.toml) and edit as needed.
# Every field below is optional; anything you omit falls back to these
# built-in defaults.

[general]
enabled = true

# Minimum length for a correction triggered by pressing Space after a word.
# Kept lower than eager_min_word_length below on purpose: by the time Space
# is pressed the word is confirmed complete (nothing more is coming), so a
# short word like "да" or "но" can be trusted the same as a long one.
# 1-letter words are never corrected no matter what this is set to - too
# easy to get a spurious hit, and too disruptive when it's a real
# single-letter word, an initial, or an abbreviation.
min_word_length = 2

# Window classes (as reported by `hyprctl activewindow`) that are never
# touched: terminals, password managers, anywhere retyping text would be
# dangerous or where non-language text (commands, passwords) is normal.
# Run `hyprctl activewindow` while focused on an app to find its class.
# A trailing `*` matches as a prefix, e.g. "steam_app_*".
excluded_classes = [
  "kitty",
  "foot",
  "Alacritty",
  "wezterm",
  "org.keepassxc.KeePassXC",
  "1Password",
  "Bitwarden",
  "steam",
  "steam_app_*",
]

# Skip Steam games entirely. Detected via the `SteamAppId` environment
# variable Steam sets on every game it launches (native or Proton), so this
# works without needing to list every game's window class individually.
exclude_steam_games = true

# Check for a correction after every keystroke instead of only at word
# boundaries (space/enter/tab/...). Needed for e.g. a browser address bar,
# where you type a URL and press Enter immediately rather than a space.
# Can very occasionally fire a beat early on a partial word that
# coincidentally spells a real word in the other language - see the
# README's "Known limitations" section.
eager_correction = true

# Minimum length for an eager (mid-word) correction. Kept higher than
# min_word_length above since, unlike a completed word at Space, a short
# buffer here might just be the first letters of a longer word still being
# typed - not enough to trust yet.
eager_min_word_length = 4

[layouts]
# Substrings (case-insensitive) matched against Hyprland's `active_keymap`
# description (see `hyprctl devices`) to recognize each layout.
english_match = ["English"]
russian_match = ["Russian"]

# Index of each layout in your Hyprland `kb_layout` list (0-based), used
# when switching. E.g. with `kb_layout = us,ru` in your Hyprland config:
english_index = 0
russian_index = 1

[hypr]
# Force a specific Hyprland keyboard device name instead of auto-detecting
# it from the physical device name. Only needed with multiple keyboards, or
# if auto-detection picks the wrong one. Find the right value with:
#   hyprctl devices | grep -A2 Keyboard
# device_name_override = "at-translated-set-2-keyboard"

[hotkeys]
enabled = true

# Key to double-tap to manually flip the last word to the other language,
# bypassing the dictionary check entirely - for names, jargon, or anything
# the automatic detection didn't recognize. Works on the word still being
# typed, or (if you've already moved on) the last completed one - press
# again to flip back. One of: leftshift, rightshift, leftctrl, rightctrl,
# leftalt, rightalt, leftmeta/leftsuper, rightmeta/rightsuper.
manual_correct_key = "leftshift"

# Maximum gap between the two taps, in milliseconds.
manual_correct_window_ms = 400

# Keys that, held down together, toggle the whole daemon paused/running -
# same key names as manual_correct_key above. This always works, even while
# already paused or on an excluded window - it's the way out. Same effect
# as `linuxautoswitch toggle` from a shell.
toggle_pause_keys = ["leftshift", "rightshift"]
